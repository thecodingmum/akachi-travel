<template>
  <style>
    #root { position: absolute; inset: 0; overflow: hidden; background: #0a0a0a; }
    #prod-form-clip, #prod-success-clip { position: absolute; inset: 0; }
    #prod-form { position: absolute; inset: 0; transform-origin: 50% 30%; }
    #prod-form img { position: absolute; left: 0; top: 0; width: 1080px; height: 1920px; }
    /* Each chip is a crop of the real "after" screenshot, placed over the "before" one */
    .prod-chip { position: absolute; background-image: url("assets/ui/form-filled.png");
      background-size: 1080px 1920px; background-repeat: no-repeat; transform-origin: 50% 50%; opacity: 0; }
    #prod-c1 { left: 48px;  top: 300px;  width: 248px; height: 100px; background-position: -48px -300px; }
    #prod-c2 { left: 492px; top: 300px;  width: 228px; height: 100px; background-position: -492px -300px; }
    #prod-c3 { left: 832px; top: 540px;  width: 176px; height: 100px; background-position: -832px -540px; }
    #prod-c4 { left: 48px;  top: 1080px; width: 340px; height: 100px; background-position: -48px -1080px; }
    #prod-c5 { left: 408px; top: 1080px; width: 336px; height: 100px; background-position: -408px -1080px; }
    #prod-success { position: absolute; inset: 0; transform-origin: 50% 50%; }
    #prod-success img { position: absolute; left: 0; top: 0; width: 1080px; height: 1920px; }
    #prod-gold { position: absolute; inset: 0; background: #c9a55c; }
    #prod-line { position: absolute; left: 0; top: 957px; width: 1080px; height: 6px; background: #c9a55c; opacity: 0; }
  </style>

  <div id="root" data-composition-id="product" data-width="1080" data-height="1920">
    <!-- Real screenshots of the running site at phone size (1080x1920) -->
    <div id="prod-form-clip" class="clip" data-start="0" data-duration="1.95" data-track-index="1"><div id="prod-form">
      <img id="prod-form-img" src="assets/ui/form.png" alt="Akachi Travels trip brief form" />
      <div id="prod-c1" class="prod-chip"></div>
      <div id="prod-c2" class="prod-chip"></div>
      <div id="prod-c3" class="prod-chip"></div>
      <div id="prod-c4" class="prod-chip"></div>
      <div id="prod-c5" class="prod-chip"></div>
    </div></div>
    <div id="prod-success-clip" class="clip" data-start="1.65" data-duration="2.05" data-track-index="2"><div id="prod-success">
      <img id="prod-success-img" src="assets/ui/success.png" alt="Brief received: your map is being drawn" />
    </div></div>
    <div id="prod-gold"></div>
    <div id="prod-line"></div>
  </div>

  <script>
    (function () {
      const tl = gsap.timeline({ paused: true });
      // The flood's gold resolves into the form (film 13.75 -> 14.0)
      tl.fromTo("#prod-gold", { opacity: 1 }, { opacity: 0, duration: 0.25, ease: "power2.out" }, 0.15);
      tl.fromTo("#prod-form", { scale: 1.06 }, { scale: 1.0, duration: 1.9, ease: "power2.out" }, 0.05);

      // beat-grid: chip taps every half beat - film 14.00, 14.25, 14.50, 14.75, 15.00
      ["#prod-c1", "#prod-c2", "#prod-c3", "#prod-c4", "#prod-c5"].forEach((id, k) => {
        const t = 0.4 + k * 0.25;
        tl.set(id, { opacity: 1 }, t);
        tl.fromTo(id, { scale: 0.9 }, { scale: 1, duration: 0.28, ease: "back.out(2.2)" }, t);
      });

      // Whip up into the success state (film 15.25 -> 15.50)
      tl.fromTo("#prod-form", { y: 0, filter: "blur(0px)" }, { y: -700, filter: "blur(14px)", duration: 0.22, ease: "power3.in" }, 1.68);
      tl.fromTo("#prod-success", { y: 760, filter: "blur(16px)" }, { y: 0, filter: "blur(0px)", duration: 0.26, ease: "power3.out" }, 1.68);

      // Squeeze to a single gold line (film 16.80 -> 17.06), the reference's letterbox move
      tl.fromTo("#prod-success", { scaleY: 1 }, { scaleY: 0.0031, duration: 0.26, ease: "power3.in" }, 3.2);
      tl.set("#prod-line", { opacity: 1 }, 3.44);
      window.__timelines["product"] = tl;
    })();
  </script>
</template>
