<!doctype html>
<html lang="en" data-resolution="portrait">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <script src="assets/vendor/gsap.min.js"></script>
    <style>
      :root {
        --ground: #0a0a0a;
        --gold: #c9a55c;
        --ivory: #efe9dd;
      }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body {
        margin: 0;
        width: 1080px;
        height: 1920px;
        overflow: hidden;
        background: var(--ground);
      }
      #root { width: 100%; height: 100%; position: relative; }
      #bed { position: absolute; inset: 0; background: var(--ground); }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="20" data-width="1080" data-height="1920">
      <div id="bed"></div>

      <!-- Scenes (later scenes paint over earlier ones during transitions) -->
      <div id="hook" data-composition-id="hook" data-composition-src="compositions/hook.html"
           data-start="0" data-duration="2.75" data-track-index="1" data-track-kind="graphics"
           data-width="1080" data-height="1920" style="z-index: 1"></div>
      <div id="title" data-composition-id="title" data-composition-src="compositions/title.html"
           data-start="2.25" data-duration="2.95" data-track-index="2" data-track-kind="graphics"
           data-width="1080" data-height="1920" style="z-index: 2"></div>
      <div id="montage" data-composition-id="montage" data-composition-src="compositions/montage.html"
           data-start="4.95" data-duration="4.4" data-track-index="3" data-track-kind="graphics"
           data-width="1080" data-height="1920" style="z-index: 3"></div>
      <div id="proof" data-composition-id="proof" data-composition-src="compositions/proof.html"
           data-start="8.95" data-duration="4.85" data-track-index="4" data-track-kind="graphics"
           data-width="1080" data-height="1920" style="z-index: 4"></div>
      <div id="product" data-composition-id="product" data-composition-src="compositions/product.html"
           data-start="13.6" data-duration="3.7" data-track-index="5" data-track-kind="graphics"
           data-width="1080" data-height="1920" style="z-index: 5"></div>
      <div id="endcard" data-composition-id="endcard" data-composition-src="compositions/endcard.html"
           data-start="17.1" data-duration="2.9" data-track-index="6" data-track-kind="graphics"
           data-width="1080" data-height="1920" style="z-index: 6"></div>

      <!-- Music: HeyGen library Afrobeats, 120 BPM; beats every 0.5 s, downbeats every 2 s -->
      <audio id="music" data-start="0" data-duration="20" data-track-index="10" data-volume="0.6"
             data-fade-in="0.15" data-fade-out="1.2" src="assets/music/afrobeats-heygen-c3c5baa8.mp3"></audio>

      <!-- SFX: each lands with its picture; one track per overlapping cue -->
      <audio id="sfx-the" data-start="0" data-duration="0.6" data-track-index="11" data-volume="0.55" src="assets/sfx/impactSoft_medium_001.ogg"></audio>
      <audio id="sfx-waiting" data-start="1.52" data-duration="0.6" data-track-index="12" data-volume="0.6" src="assets/sfx/impactSoft_medium_003.ogg"></audio>
      <audio id="sfx-iris" data-start="2.28" data-duration="2" data-track-index="13" data-volume="0.5" src="assets/sfx/impactBell_heavy_000.ogg"></audio>
      <audio id="sfx-whip1" data-start="4.92" data-duration="0.8" data-track-index="14" data-volume="0.45" src="assets/sfx/card-slide-2.ogg"></audio>
      <audio id="sfx-count1" data-start="9.08" data-duration="1" data-track-index="15" data-volume="0.5" src="assets/sfx/chips-stack-2.ogg"></audio>
      <audio id="sfx-72" data-start="10.52" data-duration="0.6" data-track-index="16" data-volume="0.55" src="assets/sfx/impactSoft_medium_001.ogg"></audio>
      <audio id="sfx-box1" data-start="12.02" data-duration="0.6" data-track-index="17" data-volume="0.5" src="assets/sfx/card-place-1.ogg"></audio>
      <audio id="sfx-box2" data-start="12.27" data-duration="0.6" data-track-index="18" data-volume="0.5" src="assets/sfx/card-place-3.ogg"></audio>
      <audio id="sfx-box3" data-start="12.52" data-duration="0.6" data-track-index="19" data-volume="0.5" src="assets/sfx/card-place-1.ogg"></audio>
      <audio id="sfx-box4" data-start="12.77" data-duration="0.6" data-track-index="33" data-volume="0.5" src="assets/sfx/card-place-3.ogg"></audio>
      <audio id="sfx-flood" data-start="13.4" data-duration="0.8" data-track-index="20" data-volume="0.45" src="assets/sfx/card-slide-5.ogg"></audio>
      <audio id="sfx-tap1" data-start="14.02" data-duration="0.3" data-track-index="21" data-volume="0.7" src="assets/sfx/click2.ogg"></audio>
      <audio id="sfx-tap2" data-start="14.27" data-duration="0.3" data-track-index="22" data-volume="0.7" src="assets/sfx/click3.ogg"></audio>
      <audio id="sfx-tap3" data-start="14.52" data-duration="0.3" data-track-index="23" data-volume="0.7" src="assets/sfx/click4.ogg"></audio>
      <audio id="sfx-tap4" data-start="14.77" data-duration="0.3" data-track-index="24" data-volume="0.7" src="assets/sfx/click2.ogg"></audio>
      <audio id="sfx-tap5" data-start="15.02" data-duration="0.3" data-track-index="25" data-volume="0.7" src="assets/sfx/click3.ogg"></audio>
      <audio id="sfx-whip2" data-start="15.26" data-duration="0.8" data-track-index="26" data-volume="0.4" src="assets/sfx/card-slide-2.ogg"></audio>
      <audio id="sfx-success" data-start="15.44" data-duration="0.6" data-track-index="27" data-volume="0.5" src="assets/sfx/impactSoft_medium_003.ogg"></audio>
      <audio id="sfx-logo" data-start="17.17" data-duration="2.5" data-track-index="28" data-volume="0.6" src="assets/sfx/impactBell_heavy_004.ogg"></audio>
      <audio id="sfx-key1" data-start="17.69" data-duration="0.3" data-track-index="29" data-volume="0.3" src="assets/sfx/keypress-004.wav"></audio>
      <audio id="sfx-key2" data-start="17.81" data-duration="0.3" data-track-index="30" data-volume="0.3" src="assets/sfx/keypress-011.wav"></audio>
      <audio id="sfx-key3" data-start="17.93" data-duration="0.3" data-track-index="31" data-volume="0.3" src="assets/sfx/keypress-019.wav"></audio>
      <audio id="sfx-key4" data-start="18.05" data-duration="0.3" data-track-index="32" data-volume="0.3" src="assets/sfx/keypress-027.wav"></audio>
    </div>
    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });
      window.__timelines["main"] = tl;
    </script>
  </body>
</html>
